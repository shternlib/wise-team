# Railway deployment config for Wise Team OS.
#
# Steps to deploy:
# 1. Sign in at https://railway.app
# 2. New Project -> Deploy from GitHub repo -> select shternlib/wise-team
# 3. Add a Postgres plugin (Railway auto-injects DATABASE_URL)
# 4. Add env var ANTHROPIC_API_KEY (manually, from Anthropic Console)
# 5. Railway will use this file + Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/config"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
